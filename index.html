<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 온가족 대잔치 🔥</title>

<meta property="og:type" content="website">
<meta property="og:title" content="🔥 온가족 대잔치 🔥">
<meta property="og:description" content="좋은 사람과 함께하는 좋은 시간*^^*~❤️‍🔥">
<meta property="og:image" content="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80">
<meta property="og:locale" content="ko_KR">

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Jua&display=swap');

:root {
  --main-green: #008833;
  --main-blue: #0A369D;
  --main-yellow: #FFFF00;
  --dark-bg: #112A12;
  --card-bg: rgba(255, 255, 255, 0.95);
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #2D5A27 url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80') center/cover fixed no-repeat;
  color: #000;
  font-family: 'Jua', "Pretendard", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; }

.app {
  min-height: 100vh;
  padding: 20px 12px 80px;
  background: rgba(0, 0, 0, 0.35);
}
.container {
  max-width: 580px;
  margin: 0 auto;
}

/* 상단 포스터 스타일 레트로 헤더 */
.poster-top {
  background: linear-gradient(to right, #008833, #00B0FF, #FFFF00, #008833);
  padding: 3px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.poster-inner {
  background: #FFF;
  text-align: center;
  padding: 18px 10px;
  border-radius: 10px;
}
.rainbow-heart {
  font-size: 17px;
  color: #0A369D;
  font-weight: bold;
  letter-spacing: 1px;
}
.main-title {
  margin: 10px 0 6px;
  font-size: 36px;
  font-family: 'Jua', cursive, sans-serif;
  color: var(--main-green);
  text-shadow: 
    -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF, 2px 2px 0 #FFF,
    3px 3px 0px #0A369D,
    5px 5px 0px #000;
  letter-spacing: -1px;
}

/* 카드 스타일 */
.card {
  background: var(--card-bg);
  border: 3px solid #000;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 5px 5px 0px #000;
}

.title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.step {
  background: var(--main-green);
  color: #FFF;
  border: 2px solid #000;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 900;
}
.title h2 {
  margin: 0;
  font-size: 20px;
  color: #000;
}
.help {
  margin: 4px 0 10px;
  color: #333;
  font-size: 13px;
}

/* 입력창 */
textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  padding: 12px;
  border: 2.5px solid #000;
  border-radius: 8px;
  background: #FFFFF0;
  outline: none;
  font-size: 15px;
  color: #000;
  line-height: 1.4;
}
textarea:focus, input:focus {
  background: #FFF;
  border-color: var(--main-green);
}

/* 메인 버튼 */
.main {
  width: 100%;
  border: 3px solid #000;
  border-radius: 10px;
  padding: 16px;
  color: #000;
  background: linear-gradient(to bottom, #FFFF00, #FFCC00);
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 4px 4px 0px #000;
  text-shadow: 1px 1px 0 #FFF;
}
.main:active {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px #000;
}

.sub {
  width: 100%;
  border: 2.5px solid #000;
  border-radius: 8px;
  padding: 12px;
  background: #E6FFFA;
  color: #000;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 3px 3px 0px #000;
}

.addBtn {
  width: 100%;
  border: 2.5px dashed #000;
  border-radius: 10px;
  padding: 12px;
  background: #FFF;
  color: #000;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-bottom: 16px;
}

/* 항목 카드 */
.fieldCard { background: #FFFDE7; }
.fieldTop {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.fieldName {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  border: 2px solid #000;
  border-radius: 6px;
  background: #fff;
  outline: none;
  font-size: 15px;
  font-weight: 800;
  color: var(--main-blue);
}
.removeBtn {
  border: 2px solid #000;
  border-radius: 6px;
  padding: 6px 10px;
  background: #555;
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}
.fieldOptions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.check {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #000;
  font-size: 13px;
  cursor: pointer;
  font-weight: 700;
}
.check input {
  width: 16px;
  height: 16px;
  accent-color: var(--main-green);
}
.usePeople {
  border: 2px solid #000;
  background: var(--main-yellow);
  color: #000;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.count {
  font-size: 12px;
  color: var(--main-blue);
  margin-top: 4px;
  text-align: right;
  font-weight: 700;
}

/* 하단 슬로건 문구 */
.slogan-box {
  background: rgba(0, 0, 0, 0.75);
  border: 2px solid var(--main-yellow);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  color: #FFF;
  font-family: 'Gowun Batang', serif;
  margin-top: 16px;
}
.slogan-text {
  font-size: 20px;
  color: var(--main-yellow);
  text-shadow: 1px 1px 0 #000;
  margin-bottom: 4px;
}

/* 결과 페이지 */
#resultPage, #secretPage { display: none; }
.person {
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 10px;
  background: #FFF;
  border: 2px solid #000;
  box-shadow: 3px 3px 0px var(--main-green);
}
.personName { font-weight: 900; margin-bottom: 6px; font-size: 18px; color: #0A369D; }
.linkRow { display: flex; gap: 6px; }
.linkInput {
  flex: 1;
  min-width: 0;
  border: 2px solid #000;
  border-radius: 6px;
  padding: 6px 8px;
  background: #F0F0F0;
  color: #333;
  font-size: 11px;
}
.copy {
  border: 2px solid #000;
  border-radius: 6px;
  padding: 0 12px;
  background: var(--main-green);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.2s;
}

/* 비밀 페이지 */
.secret { text-align: center; }
.secretName { 
  font-size: 30px; 
  font-weight: 900; 
  color: #0A369D; 
  text-shadow: 1px 1px 0 var(--main-yellow), 2px 2px 0 #000;
}
.secretSub { color: #000; font-size: 15px; font-weight: 700; margin: 6px 0 16px; }
.resultBox {
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  background: #FFFDE7;
  border: 2.5px solid #000;
  box-shadow: 3px 3px 0px #000;
  text-align: left;
}
.label {
  color: var(--main-green);
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 4px;
}
.value {
  color: #000;
  font-size: 22px;
  font-weight: 900;
}

.notice {
  margin-top: 14px;
  padding: 12px;
  border-radius: 8px;
  background: #FFF;
  border: 2px solid #000;
  color: #000;
  font-size: 13px;
  line-height: 1.4;
}

.full { display: none; margin-top: 16px; }
.fullItem {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 8px;
  background: #FFF;
  border: 2px solid #000;
  text-align: left;
}
.fullItem strong { display: block; margin-bottom: 4px; font-size: 15px; color: #0A369D; }
.fullLine { font-size: 13px; color: #000; }

.smallBtn {
  border: 0;
  background: none;
  color: #0A369D;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 14px;
  text-decoration: underline;
}

/* 📱 모바일 화면 최적화 */
@media (max-width: 480px) {
  .main-title { font-size: 28px; }
  .card { padding: 14px; }
  .rainbow-heart { font-size: 15px; }
}
</style>
</head>
<body>
<div class="app"><div class="container">

<section id="hostPage">
  <div class="poster-top">
    <div class="poster-inner">
      <div class="rainbow-heart">💚 좋은 사람과 함께하는 💚</div>
      <div class="main-title">🔥 온가족 대잔치 🔥</div>
    </div>
  </div>

  <div class="card">
    <div class="title"><span class="step">명단 작성</span><h2>참석자 명단</h2></div>
    <p class="help">한 줄에 한 명씩 이름을 입력해 주세요 🚩</p>
    <textarea id="participants" placeholder="코난&#10;세모&#10;뭉치&#10;아름이"></textarea>
    <div id="peopleCount" class="count">0명 입력 완료 ⛰️</div>
  </div>

  <div class="card">
    <div class="title"><span class="step">추첨 설정</span><h2>뽑기 항목</h2></div>
    <div id="fields"></div>
    <button class="addBtn" onclick="addField()">＋ 추첨 항목 추가하기 🌲</button>
  </div>

  <button class="main" onclick="createGame()">🔥 추첨 🔥</button>

  <div class="slogan-box">
    <div class="slogan-text">멋진 인생... 좋은 사람과 함께... 🤍</div>
  </div>
</section>

<section id="resultPage">
  <div class="poster-top">
    <div class="poster-inner">
      <div class="rainbow-heart">🎉 추첨 결과 🎉</div>
      <div class="main-title" style="font-size:28px;">개별 링크 발급 완료</div>
      <p style="margin:4px 0 0; font-size:13px;">개별 링크를 복사해 주세요!</p>
    </div>
  </div>

  <div class="card">
    <div id="links"></div>

    <div class="notice">
      🤫 <b>[보안 주의]</b><br>
      개별 링크를 카톡으로 전달해 주세요! 🌲
    </div>

    <button class="sub" onclick="toggleAll()">🚩 전체 추첨 결과 보기</button>
    <div id="full" class="full">
      <hr style="border:1px solid #000; margin:12px 0;">
      <h3 style="margin-bottom:8px; color:#0A369D">전체 명단 결과</h3>
      <div id="allResults"></div>
    </div>

    <div style="text-align:center;">
      <button class="smallBtn" onclick="restart()">🔄 다시 만들기</button>
    </div>
  </div>
</section>

<section id="secretPage">
  <div class="poster-top">
    <div class="poster-inner">
      <div class="rainbow-heart">🌲 온가족 대잔치 🌲</div>
      <div id="secretName" class="secretName" style="margin-top:6px;"></div>
      <div class="secretSub">회원님의 추첨 결과입니다! </div>
    </div>
  </div>

  <div class="card secret">
    <div id="secretResults"></div>

    <div class="notice" style="text-align:left">
      🔥 <b>[행동 수칙]</b><br>
      비밀로 유지해 주세요!
    </div>
  </div>
</section>

</div></div>

<script>
let fieldCounter=0;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function escapeHtml(s){
  const d=document.createElement("div");
  d.textContent=s;
  return d.innerHTML;
}

function getLines(value){
  return value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
}

function encodeResult(obj){
  const json=JSON.stringify(obj);
  const bytes=new TextEncoder().encode(json);
  let binary="";
  for(const b of bytes) binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
}

function decodeResult(str){
  try{
    str=str.replace(/-/g,"+").replace(/_/g,"/");
    while(str.length%4) str+="=";
    const binary=atob(str);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){
    return null;
  }
}

async function copyLink(link, name, btnEl){
  let copied = false;
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(link);
      copied = true;
    } catch(e) {}
  }
  
  if(!copied){
    prompt("아래 링크를 복사해주세요!", link);
    return;
  }

  // 버튼 인터랙션 개선
  const originalText = btnEl.textContent;
  btnEl.textContent = "완료! 👍";
  btnEl.style.background = "#00B0FF";
  setTimeout(() => {
    btnEl.textContent = originalText;
    btnEl.style.background = "var(--main-green)";
  }, 1500);
}

function updatePeopleCount(){
  const n=getLines(document.getElementById("participants").value).length;
  document.getElementById("peopleCount").textContent=n+"명 입력 완료 ⛰️";
}

function addField(name="", values="", noSelf=false){
  fieldCounter++;
  const id=fieldCounter;
  const wrap=document.createElement("div");
  wrap.className="fieldCard";
  wrap.style.cssText="border:2px solid #000; border-radius:8px; padding:12px; margin-bottom:10px;";
  wrap.dataset.fieldId=id;

  wrap.innerHTML=`
    <div class="fieldTop">
      <input class="fieldName" maxlength="30" placeholder="항목 이름 (예: 마니또, 준비물)" value="${escapeHtml(name)}">
      <button class="removeBtn" type="button">삭제</button>
    </div>
    <textarea class="fieldValues" placeholder="후보 항목을 한 줄에 하나씩 적어주세요 🌲">${escapeHtml(values)}</textarea>
    <div class="fieldOptions">
      <label class="check">
        <input class="noSelf" type="checkbox" ${noSelf ? "checked" : ""}>
        자기 자신 뽑기 금지 🙅‍♂️
      </label>
      <button class="usePeople" type="button">👥 참석자 명단 불러오기</button>
    </div>
    <div class="count fieldCount">0개 후보 준비 완료</div>
  `;

  wrap.querySelector(".removeBtn").addEventListener("click",()=>{
    const cards=document.querySelectorAll(".fieldCard");
    if(cards.length<=1){
      alert("항목은 최소 1개 이상 필요합니다!");
      return;
    }
    wrap.remove();
  });

  wrap.querySelector(".usePeople").addEventListener("click",()=>{
    const people=getLines(document.getElementById("participants").value);
    if(!people.length){
      alert("먼저 참석자 명단을 입력해 주십시오!");
      return;
    }
    wrap.querySelector(".fieldValues").value=people.join("\n");
    wrap.querySelector(".noSelf").checked=true;
    updateFieldCount(wrap);
  });

  wrap.querySelector(".fieldValues").addEventListener("input",()=>updateFieldCount(wrap));

  document.getElementById("fields").appendChild(wrap);
  updateFieldCount(wrap);
}

function updateFieldCount(card){
  const n=getLines(card.querySelector(".fieldValues").value).length;
  card.querySelector(".fieldCount").textContent=n+"개 후보 준비 완료";
}

function assignField(people, candidates, noSelf){
  if(candidates.length < people.length) return null;

  if(!noSelf){
    const shuffled=shuffle([...candidates]);
    return people.map((p,i)=>shuffled[i]);
  }

  if(candidates.length===people.length &&
     [...candidates].sort().join("\u0000")===[...people].sort().join("\u0000")){
    const order=shuffle([...people]);
    const map={};
    for(let i=0;i<order.length;i++){
      map[order[i]]=order[(i+1)%order.length];
    }
    return people.map(p=>map[p]);
  }

  for(let attempt=0;attempt<1000;attempt++){
    const shuffled=shuffle([...candidates]);
    const chosen=shuffled.slice(0,people.length);
    if(people.every((p,i)=>chosen[i]!==p)){
      return chosen;
    }
  }

  return null;
}

function createGame(){
  const people=getLines(document.getElementById("participants").value);

  if(people.length<2){
    alert("인원이 최소 2명 이상이어야 진행이 가능합니다! ⛰️");
    return;
  }

  if(new Set(people).size!==people.length){
    alert("명단에 중복된 이름이 있습니다!");
    return;
  }

  const cards=[...document.querySelectorAll(".fieldCard")];
  if(!cards.length){
    alert("추첨 항목을 1개 이상 작성해 주십시오!");
    return;
  }

  const fields=[];
  const usedNames=new Set();

  for(let i=0;i<cards.length;i++){
    const card=cards[i];
    const name=card.querySelector(".fieldName").value.trim();
    const values=getLines(card.querySelector(".fieldValues").value);
    const noSelf=card.querySelector(".noSelf").checked;

    if(!name){
      alert((i+1)+"번째 항목의 제목을 정해 주십시오!");
      return;
    }

    if(usedNames.has(name)){
      alert("항목 이름이 중복되었습니다: "+name);
      return;
    }
    usedNames.add(name);

    if(values.length<people.length){
      alert("["+name+"] 항목 후보가 부족합니다!\n명단: "+people.length+"명 / 후보: "+values.length+"개");
      return;
    }

    if(new Set(values).size!==values.length){
      alert("["+name+"] 항목에 중복된 후보가 있습니다!");
      return;
    }

    fields.push({name,values,noSelf});
  }

  try {
    const assigned=fields.map(field=>{
      const values=assignField(people,field.values,field.noSelf);
      if(!values){
        alert("["+field.name+"] 항목 매칭 실패! 조건을 확인해 주십시오.");
        throw new Error("assignment failed");
      }
      return values;
    });

    const results=people.map((name,i)=>({
      name,
      items:fields.map((field,fIndex)=>({
        label:field.name,
        value:assigned[fIndex][i]
      }))
    }));

    const gameId=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
    localStorage.setItem("random-secret-host-"+gameId,JSON.stringify(results));

    const links=document.getElementById("links");
    links.innerHTML="";

    results.forEach(result=>{
      const personal={n:result.name,items:result.items};
      const encoded=encodeResult(personal);
      const base=location.href.split("#")[0];
      const link=base+"#r="+encoded;

      const div=document.createElement("div");
      div.className="person";
      div.innerHTML=`
        <div class="personName">🚩 ${escapeHtml(result.name)} 님</div>
        <div class="linkRow">
          <input class="linkInput" value="${escapeHtml(link)}" readonly>
          <button class="copy">복사</button>
        </div>
      `;

      const copyBtn = div.querySelector(".copy");
      copyBtn.addEventListener("click",()=>copyLink(link,result.name,copyBtn));
      links.appendChild(div);
    });

    const all=document.getElementById("allResults");
    all.innerHTML="";

    results.forEach(r=>{
      const div=document.createElement("div");
      div.className="fullItem";
      const lines=r.items.map(item=>
        `<div class="fullLine">🌲 <b>${escapeHtml(item.label)}</b>: ${escapeHtml(item.value)}</div>`
      ).join("");
      div.innerHTML=`<strong>🚩 ${escapeHtml(r.name)} 님</strong>${lines}`;
      all.appendChild(div);
    });

    document.getElementById("hostPage").style.display="none";
    document.getElementById("resultPage").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  } catch(e) {
    // 매칭 실패 예외 처리
  }
}

function toggleAll(){
  const el=document.getElementById("full");
  el.style.display=el.style.display==="block"?"none":"block";
}

function openSecret(data){
  document.getElementById("hostPage").style.display="none";
  document.getElementById("resultPage").style.display="none";
  document.getElementById("secretPage").style.display="block";

  document.getElementById("secretName").textContent=data.n+" 님";
  const area=document.getElementById("secretResults");
  area.innerHTML="";

  data.items.forEach(item=>{
    const div=document.createElement("div");
    div.className="resultBox";
    div.innerHTML=`
      <div class="label">📌 ${escapeHtml(item.label).toUpperCase()}</div>
      <div class="value">${escapeHtml(item.value)}</div>
    `;
    area.appendChild(div);
  });
}

function checkLink(){
  const hash=location.hash;
  if(!hash.startsWith("#r=")) return;

  const data=decodeResult(hash.slice(3));
  if(!data || !data.n || !Array.isArray(data.items)){
    alert("올바르지 않은 링크입니다!");
    return;
  }
  openSecret(data);
}

function restart(){
  location.href=location.href.split("#")[0];
}

document.getElementById("participants").addEventListener("input",updatePeopleCount);

window.addEventListener("load",()=>{
  if(location.hash.startsWith("#r=")){
    checkLink();
    return;
  }

  // 기본 세팅
  addField("마니또", "", true);
});
</script>
</body>
</html>
